apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: go-lab-https
  namespace: go-lab
spec:
  gatewayClassName: go-lab-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: go-lab-proxy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: checkout.k8s.test
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: checkout-lab-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout-https
  namespace: go-lab
spec:
  parentRefs:
    - name: go-lab-https
      sectionName: https
  hostnames:
    - checkout.k8s.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/checkout
      backendRefs:
        - name: checkout
          port: 80
