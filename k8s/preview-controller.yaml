apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-controller
  namespace: go-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-controller
  namespace: go-lab
rules:
  - apiGroups: ["lab.example.com"]
    resources: ["shippingpreviews"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["lab.example.com"]
    resources: ["shippingpreviews/status"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-controller
  namespace: go-lab
subjects:
  - kind: ServiceAccount
    name: preview-controller
    namespace: go-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-controller
  namespace: go-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: preview-controller
  template:
    metadata:
      labels:
        app: preview-controller
    spec:
      serviceAccountName: preview-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: go-preview-controller:v2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
