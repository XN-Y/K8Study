apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: go-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: go-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: go-lab
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: go-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pod-reader
  namespace: go-lab
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: pod-reader
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: go-pod-reader:v1
          imagePullPolicy: IfNotPresent
          args: ["-namespace=go-lab"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
