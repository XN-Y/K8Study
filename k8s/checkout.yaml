apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: go-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: go-checkout:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: SHIPPING_API_URL
              value: http://shipping.go-lab.svc.cluster.local/api/shipping
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: go-lab
spec:
  selector:
    app: checkout
  ports:
    - port: 80
      targetPort: http
