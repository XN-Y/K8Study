apiVersion: batch/v1
kind: CronJob
metadata:
  name: shipping-report
  namespace: go-lab
spec:
  schedule: "*/5 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: go-shipping:v1
              imagePullPolicy: IfNotPresent
              args: ["report"]
              resources:
                requests:
                  cpu: 25m
                  memory: 16Mi
                limits:
                  cpu: 250m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
