apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-lab
  namespace: go-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 3s
    scrape_configs:
      - job_name: checkout
        static_configs:
          - targets: ["checkout.go-lab.svc.cluster.local:80"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-lab
  namespace: go-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-lab
  template:
    metadata:
      labels:
        app: prometheus-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/lab/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 40m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/lab
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-lab
        - name: data
          emptyDir: {}
